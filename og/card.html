<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,100,0;1,9..144,300..600,100,0&family=Hind+Vadodara:wght@400;500;600&display=swap">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#F2EADC;font-family:"Hind Vadodara",sans-serif;color:#1B1D2B}
.card{position:absolute;inset:24px;border-radius:36px;background:#8A3A1A;overflow:hidden;color:#FBF7F0}
.glow{position:absolute;left:52%;top:-20%;width:700px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(227,166,47,.35),rgba(227,166,47,0));}
.rug{position:absolute;right:-30px;top:70px;width:640px;transform:perspective(1400px) rotateX(38deg) rotateZ(-10deg);filter:drop-shadow(0 6px 0 rgba(40,12,4,.55)) drop-shadow(0 30px 40px rgba(30,8,2,.45))}
.z{position:absolute;right:70px;top:350px;width:400px;transform:perspective(1400px) rotateX(36deg) rotateZ(8deg);filter:drop-shadow(0 5px 0 rgba(10,10,20,.5)) drop-shadow(0 26px 30px rgba(30,8,2,.45))}
.copy{position:absolute;left:64px;top:64px;width:520px}
.logo{display:flex;align-items:center;gap:14px;font:italic 400 34px/1 Fraunces,serif;font-variation-settings:"opsz" 144,"SOFT" 100}
.logo img{width:56px;height:56px;border-radius:50%}
h1{margin:120px 0 0;font:400 78px/1 Fraunces,serif;font-variation-settings:"opsz" 144,"SOFT" 100;letter-spacing:-.02em}
h1 em{font-style:italic;font-weight:360}
p{margin:22px 0 0;font:500 26px/1.35 "Hind Vadodara";opacity:.92}
.price{position:absolute;left:64px;bottom:56px;display:flex;gap:12px}
.price span{padding:12px 22px;border-radius:999px;background:#FBF7F0;color:#1B1D2B;font:600 24px/1 "Hind Vadodara"}
.price span.q{background:rgba(251,247,240,.16);color:#FBF7F0}
</style></head><body>
<div class="card"><span class="glow"></span>
<img class="rug" src="../site/img/s4.webp"><img class="z" src="../site/img/z3.webp">
<div class="copy"><div class="logo"><img src="../site/img/logo.jpg">Soft Steps</div>
<h1>Soft steps, <em>every&nbsp;morning</em></h1>
<p>Rugs, doormats &amp; bath mats from Vadodara</p></div>
<div class="price"><span>From ₹249</span><span class="q">26 colours · UPI · WhatsApp</span></div>
</div></body></html>
